name: 打包 macOS 版

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install pyinstaller pillow

      - name: 打包（含 OPPO）
        run: |
          pyinstaller --onefile --console \
            --name "配色工具" \
            --distpath dist \
            --add-data "color_toolbox:color_toolbox" \
            --workpath "color_toolbox/build/pyinstaller_main" \
            --specpath "color_toolbox" \
            "color_toolbox/main.py"

      - name: 打包（无 OPPO）
        run: |
          pyinstaller --onefile --console \
            --name "配色工具_无OPPO" \
            --distpath dist \
            --add-data "color_toolbox:color_toolbox" \
            --workpath "color_toolbox/build/pyinstaller_no_oppo" \
            --specpath "color_toolbox" \
            "color_toolbox/main_no_oppo.py"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 配色工具-macOS
          path: dist/
